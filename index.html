<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <title>Quiz Application with Timer</title>
</head>

<body>

  
  <div class="container mt-4">
    <div class="d-flex justify-content-center" id="timer">Time: 0s</div> 
    <h1 class="d-flex justify-content-center">Quiz Application SMIT</h1>
    <div id="progress"></div>
    <hr /><br />
  
    <div class="main text-center">
      <p id="ques"></p>
  
      <div class="option-container">
        <input disabled type="radio" name="quiz" id="radio1" onclick="btnWork()" />
        <label id="opt1" for="radio1"></label>
      </div>
  
      <div class="option-container">
        <input disabled type="radio" name="quiz" id="radio2" onclick="btnWork()" />
        <label id="opt2" for="radio2"></label>
      </div>
  
      <div class="option-container">
        <input disabled type="radio" name="quiz" id="radio3" onclick="btnWork()" />
        <label id="opt3" for="radio3"></label>
      </div>
      <button class="btn btn-warning" id="startBtn" onclick="startQuiz()">Start</button>
      <button class="btn btn-success" id="btn" onclick="nextQuestion()">Next</button>
      <button class="btn btn-info" id="resetBtn" onclick="resetQuiz()">Reset Quiz</button>
    </div>
  
  
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <script src="app.js"></script>

</body>
</html>
